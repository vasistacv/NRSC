name: Daily Rainfall Ground Truth Scraper

on:
  schedule:
    # Run daily at 5:30 AM UTC = 11:00 AM IST (data updates in morning)
    - cron: '30 5 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_groundtruth.py

      - name: Commit updated CSV
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add groundtruth_june2026.csv
          git diff --staged --quiet || git commit -m "📊 Daily rainfall data $(date -u +%Y-%m-%d)"
          git push
